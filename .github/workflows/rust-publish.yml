name: Rust (for tags)

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: cargo build --verbose
    - name: Run clippy
      run: cargo clippy --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Publish to crates.io
      run: 'CARGO_REGISTRY_TOKEN="${{ secrets.CRATES_TOKEN }}" cargo publish --verbose'
    - name: Create release
      run: gh release create --verify-tag --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
